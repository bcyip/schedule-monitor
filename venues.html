<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Venues Browser</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #F4F6FA; margin: 0; color: #1a1a1a; }
    header { background: #11213F; color: #E7C247; padding: 12px 20px; font-weight: 700; font-size: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    header .nav-links { display: flex; gap: 16px; }
    header a { color: #6BC4E8; text-decoration: none; font-size: 13px; font-weight: 600; }
    main { max-width: 1300px; margin: 0 auto; padding: 24px; }
    .card { background: #fff; border: 1px solid #E1E5EC; border-radius: 10px; padding: 20px; margin-bottom: 18px; }
    .muted { color: #5A6472; font-size: 13px; }
    input[type=text] { padding: 9px 12px; border: 1px solid #E1E5EC; border-radius: 6px; font-size: 14px; width: 320px; max-width: 100%; }
    button { padding: 10px 18px; border-radius: 6px; border: none; background: #11213F; color: #fff; font-weight: 600; cursor: pointer; font-size: 14px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; font-size: 10px; text-transform: uppercase; color: #5A6472; padding: 6px 8px; border-bottom: 2px solid #E1E5EC; white-space: nowrap; }
    td { padding: 7px 8px; border-bottom: 1px solid #E1E5EC; font-size: 13px; }
    tr.venue-row { cursor: pointer; }
    tr.venue-row:hover { background: #F4F9FD; }
    tr.venue-row.selected { background: #E7F3FB; }
    tr.is-new { background: #FDF0DD; }
    .err-box { background: #FBEAE8; color: #C0392B; padding: 10px 14px; border-radius: 6px; margin-top: 10px; font-size: 13px; white-space: pre-wrap; }
  </style>
</head>
<body>
<header>
  Venues Browser
  <div class="nav-links">
    <a href="/">Change Monitor</a>
    <a href="/schedule">Schedule Browser</a>
  </div>
</header>
<main>
  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
      <h3 style="margin:0;">All Venues</h3>
      <div style="display:flex; gap:10px; align-items:center;">
        <input type="text" id="searchBox" placeholder="Search by venue name..." oninput="filterVenues()" />
        <button onclick="downloadCombinedCsv()" style="padding:8px 14px; font-size:13px;">Download CSV</button>
      </div>
    </div>
    <p class="muted" style="margin-top:8px;">Click a venue below to load its subvenues (fields).</p>
    <div id="venuesBox"><p class="muted">Loading venues...</p></div>
  </div>
</main>
<script>
  let allVenues = [];

  async function loadVenues() {
    const box = document.getElementById('venuesBox');
    try {
      const res = await fetch('/api/venues');
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Unknown error');
      allVenues = data.venues;
      currentFilteredVenues = data.venues;

      const mismatchWarning = data.countMismatch
        ? '<div class="err-box">WARNING - PAGINATION COUNT MISMATCH: expected ' + data.expectedCount + ' venues, only collected ' + data.actualCount + '. Some venues were likely missed during this fetch. Reload the page to re-query.</div>'
        : '';
      box.innerHTML = mismatchWarning;
      renderVenues(allVenues);
    } catch (e) {
      box.innerHTML = '<div class="err-box">Failed to load venues: ' + escapeHtml(e.message) + '</div>';
    }
  }

  let currentFilteredVenues = []; // tracks exactly what's currently displayed, for the CSV export

  function filterVenues() {
    const term = document.getElementById('searchBox').value.trim().toLowerCase();
    currentFilteredVenues = term ? allVenues.filter(v => (v.name || '').toLowerCase().includes(term)) : allVenues;
    renderVenues(currentFilteredVenues, true);
  }

  function renderVenues(venues, preserveWarning) {
    const box = document.getElementById('venuesBox');
    const existingWarning = preserveWarning ? '' : (box.querySelector('.err-box') ? box.querySelector('.err-box').outerHTML : '');

    if (!venues || venues.length === 0) {
      box.innerHTML = existingWarning + '<p class="muted">No venues found.</p>';
      return;
    }

    const tableHtml = `
      <p class="muted" style="margin-top:8px;">${venues.length} venue(s). <span style="color:#E7871A;">Orange rows</span> = created in the last 24h.</p>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>Name</th><th>Venue UUID</th><th>Address</th><th>Map</th><th># Subvenues</th><th>Updated (UTC)</th></tr></thead>
        <tbody>
          ${venues.map(v => `
            <tr class="venue-row ${v.isNew ? 'is-new' : ''}" data-venue-id="${escapeHtml(v.venueId)}" data-venue-name="${escapeHtml(v.name || '')}">
              <td>${escapeHtml(v.name || '')}</td>
              <td style="font-size:11px;">${escapeHtml(v.venueId)}</td>
              <td>${escapeHtml(v.address || '')}</td>
              <td>${v.mapUrl ? '<a href="' + escapeHtml(v.mapUrl) + '" target="_blank" rel="noopener">Map</a>' : ''}</td>
              <td>${escapeHtml(v.subvenueCount ?? '')}</td>
              <td>${formatUTC(v.updatedAt)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    `;

    if (preserveWarning) {
      const currentWarning = box.querySelector('.err-box') ? box.querySelector('.err-box').outerHTML : '';
      box.innerHTML = currentWarning + tableHtml;
    } else {
      box.innerHTML = existingWarning + tableHtml;
    }
  }

  let currentSubvenues = []; // stored so the combined CSV export can include them
  let currentVenueId = null;
  let currentVenueName = null;

  const VENUE_TABLE_COLSPAN = 6; // Name, Venue UUID, Address, Map, # Subvenues, Updated (UTC)

  async function loadSubvenues(venueId, venueName) {
    const clickedRow = document.querySelector(`.venue-row[data-venue-id="${CSS.escape(venueId)}"]`);
    if (!clickedRow) return;

    const existingExpansion = clickedRow.nextElementSibling;
    const isAlreadyExpanded = existingExpansion && existingExpansion.classList.contains('subvenue-expansion') && clickedRow.classList.contains('selected');

    // Collapse whatever's currently expanded (if any), and deselect its row.
    document.querySelectorAll('.subvenue-expansion').forEach(row => row.remove());
    document.querySelectorAll('.venue-row').forEach(row => row.classList.remove('selected'));

    if (isAlreadyExpanded) {
      // Clicking an already-expanded venue again just collapses it - done.
      return;
    }

    clickedRow.classList.add('selected');
    currentVenueId = venueId;
    currentVenueName = venueName;

    // Insert a loading row directly under the clicked venue immediately,
    // then fetch (only now - never eagerly) and replace its contents.
    const loadingRow = document.createElement('tr');
    loadingRow.className = 'subvenue-expansion';
    loadingRow.innerHTML = `<td colspan="${VENUE_TABLE_COLSPAN}"><p class="muted" style="margin:6px 0;">Loading subvenues...</p></td>`;
    clickedRow.after(loadingRow);

    try {
      const res = await fetch('/api/subvenues?venueId=' + encodeURIComponent(venueId));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Unknown error');

      currentSubvenues = data.subvenues || [];

      const mismatchWarning = data.countMismatch
        ? '<div class="err-box">WARNING - PAGINATION COUNT MISMATCH: expected ' + data.expectedCount + ' subvenues, only collected ' + data.actualCount + '. Click the venue again to re-query.</div>'
        : '';

      if (!data.subvenues || data.subvenues.length === 0) {
        loadingRow.innerHTML = `<td colspan="${VENUE_TABLE_COLSPAN}">${mismatchWarning}<p class="muted" style="margin:6px 0;">No subvenues found for this venue.</p></td>`;
        return;
      }

      loadingRow.innerHTML = `
        <td colspan="${VENUE_TABLE_COLSPAN}" style="background:#F9FAFC; padding:10px 16px;">
          ${mismatchWarning}
          <p class="muted" style="margin:4px 0 6px;">${data.subvenues.length} subvenue(s) for ${escapeHtml(venueName)}. <span style="color:#E7871A;">Orange rows</span> = updated in the last 24h.</p>
          <table>
            <thead><tr><th>Field Name</th><th>Subvenue UUID</th><th>Updated (UTC)</th></tr></thead>
            <tbody>
              ${data.subvenues.map(s => `
                <tr class="${s.isNew ? 'is-new' : ''}">
                  <td>${escapeHtml(s.name || '')}</td>
                  <td style="font-size:11px;">${escapeHtml(s.id)}</td>
                  <td>${formatUTC(s.updatedAt)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </td>
      `;
    } catch (e) {
      loadingRow.innerHTML = `<td colspan="${VENUE_TABLE_COLSPAN}"><div class="err-box">Failed to load subvenues: ${escapeHtml(e.message)}</div></td>`;
    }
  }

  function formatUTC(isoString) {
    if (!isoString) return '';
    const d = new Date(isoString);
    return d.toLocaleString('en-US', { timeZone: 'UTC', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' UTC';
  }

  function csvEscape(val) {
    if (val == null) return '';
    const str = String(val);
    if (str.includes(',') || str.includes('"') || str.includes('\n')) {
      return '"' + str.replace(/"/g, '""') + '"';
    }
    return str;
  }

  function downloadCombinedCsv() {
    const lines = [];

    lines.push('=== VENUES (' + currentFilteredVenues.length + (document.getElementById('searchBox').value.trim() ? ', filtered by "' + document.getElementById('searchBox').value.trim() + '"' : '') + ') ===');
    lines.push(['Venue UUID', 'Name', 'Address', 'Map Link', '# Subvenues', 'Updated (UTC)', 'URL'].join(','));
    for (const v of currentFilteredVenues) {
      lines.push([csvEscape(v.venueId), csvEscape(v.name), csvEscape(v.address), csvEscape(v.mapUrl), csvEscape(v.subvenueCount), csvEscape(formatUTC(v.updatedAt)), csvEscape(v.url)].join(','));
    }

    if (currentVenueId && currentSubvenues.length > 0) {
      lines.push('');
      lines.push('=== SUBVENUES for ' + currentVenueName + ' (' + currentSubvenues.length + ') ===');
      lines.push(['Subvenue UUID', 'Field Name', 'Venue UUID', 'Updated (UTC)'].join(','));
      for (const s of currentSubvenues) {
        lines.push([csvEscape(s.id), csvEscape(s.name), csvEscape(s.venueId), csvEscape(formatUTC(s.updatedAt))].join(','));
      }
    }

    const csvContent = lines.join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = currentVenueId ? 'venues-and-' + currentVenueName.replace(/[^a-z0-9]+/gi, '-') + '-subvenues.csv' : 'venues.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  loadVenues();

  // Event delegation: one listener on the container, reads properly
  // HTML-escaped data-* attributes via the DOM rather than interpolating
  // values into inline onclick handlers (which broke on the double-quote
  // conflict between JSON.stringify's output and the attribute's own
  // quoting - see conversation). This is also immune to venue names
  // containing quotes or apostrophes, which the old approach was not.
  document.getElementById('venuesBox').addEventListener('click', (e) => {
    const row = e.target.closest('tr.venue-row');
    if (!row) return;
    loadSubvenues(row.dataset.venueId, row.dataset.venueName);
  });
</script>
</body>
</html>
